name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/cli

      - name: Generate Android Project
        run: |
          npx @pwabuilder/cli package -m ./manifest.json -d ./android_app -p android --name "BilancioCalorico" --packageId "com.bilancio.calorico"

      - name: Build APK with Gradle
        run: |
          cd android_app
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bilancio-Calorico-APK
          path: android_app/app/build/outputs/apk/debug/*.apk
