name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/cli

      - name: Build Android APK
        run: |
          npx @pwabuilder/cli package -m ./manifest.json -d ./android_app -p android --name "BilancioCalorico" --packageId "com.bilancio.calorico" || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bilancio-Calorico-APK
          path: |
            android_app/**/*.apk
            *.apk
          if-no-files-found: warn
